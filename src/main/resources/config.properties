# MonikaMart Application Configuration

# Database Configuration (H2 File persistence for Tomcat/Standalone)
db.driver=org.h2.Driver
db.url=jdbc:h2:./data/monikamart;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
db.user=sa
db.password=
db.pool.maximumPoolSize=15
db.pool.minimumIdle=5
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1800000

# Application Server Settings
server.port=8080
server.session.timeout.minutes=30

# AI Chatbot Configuration
ai.chatbot.provider=mock
ai.chatbot.gemini.key=
ai.chatbot.gemini.model=gemini-1.5-flash
ai.chatbot.rate.limit.per.minute=10
ai.chatbot.max.prompt.length=500

# Secure Admin Account Configuration (Password read exclusively from ADMIN_PASSWORD environment variable)
admin.email=monikaraja433@gmail.com
admin.name=Monika Raja
